# configuration file /etc/nginx/sites-enabled/dev.conf:
server {
    listen 80;
    server_name app-dev.dnow.hk;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name app-dev.dnow.hk;

    client_max_body_size 10M;
    proxy_buffer_size    128k;
    proxy_buffers        4 256k;

    access_log /var/log/nginx/app-dev.dnow.hk.access.log;
    error_log /var/log/nginx/app-dev.dnow.hk.error.log;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+ECDSA+AESGCM:EECDH+aRSA+AESGCM:EECDH+ECDSA+SHA256:EECDH+aRSA+SHA256:EECDH+ECDSA+SHA384:EECDH+ECDSA+SHA256:EECDH+aRSA+SHA384:EDH+aRSA+AESGCM:EDH+aRSA+SHA256:EDH+aRSA:EECDH:!aNULL:!eNULL:!MEDIUM:!LOW:!3DES:!MD5:!EXP:!PSK:!SRP:!DSS:!RC4:!SEED";

    add_header Strict-Transport-Security "max-age=31536000";

    ssl_certificate /etc/nginx/certs/ssl-bundle-2024.crt;
    ssl_certificate_key /etc/nginx/certs/*.dnow.hk.key;

    location / {
        proxy_pass http://127.0.0.1:13010/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        proxy_redirect off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    error_page 404 /static/404.html;
}


