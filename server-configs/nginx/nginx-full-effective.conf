server {
    listen 80;
    server_name portal.angelcare.dnow.hk;
    return 301 https://$host$request_uri;
}
server {
    listen 443;
    server_name portal.angelcare.dnow.hk;
    client_max_body_size 50m;
    
    access_log /var/log/nginx/portal.angelcare.dnow.hk.access.log;
    error_log /var/log/nginx/portal.angelcare.dnow.hk.error.log;
    
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Content-Security-Policy upgrade-insecure-requests;

    ssl_certificate /etc/nginx/certs/ssl-bundle-2024.crt;
    ssl_certificate_key /etc/nginx/certs/*.dnow.hk.key;

    location / {
        root /data/angelcare_portal/dist; # Vue 项目的 dist 目录路径
        try_files $uri $uri/ /index.html; # 处理前端路由的回退到 index.html
    }
}

